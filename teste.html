<!DOCTYPE html>

        <script>
            //Exerc. 1)---------------------------------------------------------------------------------------------
            function CalculaIndice() {
                let Ind = 13;
                let Soma = 0
                let k = 0;
                while (k < Ind) {
                    Soma = Soma + k;
                    k++;
                }
                return Soma;
            }

            //Exerc. 2)---------------------------------------------------------------------------------------------
            function fibonacci(numero) {
                let fib = [0, 1];

                while (fib[fib.length - 1] < numero) {
                    const nextFib = fib[fib.length - 1] + fib[fib.length - 2];
                    fib.push(nextFib);
                }

                return fib;
            }

            function pertenceAFibonacci(numero) {
                const seqFibo = fibonacci(numero);
                if (seqFibo.includes(numero)) {
                    return `O número ${numero} pertence à sequência de Fibonacci.`;
                } else {
                    return `O número ${numero} NÃO pertence à sequência de Fibonacci.`;
                }
            }

            function calcularFaturamento(faturamento) {
                const faturamentoValidos = faturamento.filter(dia => dia.valor > 0.0);
                const menorFaturamento = Math.min(...faturamentoValidos.map(dia => dia.valor));
                const maiorFaturamento = Math.max(...faturamentoValidos.map(dia => dia.valor));
                const somaFaturamento = faturamentoValidos.reduce((acc, dia) => acc + dia.valor, 0);
                const mediaFaturamento = somaFaturamento / faturamentoValidos.length;
                const diasAcimaDaMedia = faturamentoValidos.filter(dia => dia.valor > mediaFaturamento).length;

                return {
                    menorFaturamento,
                    maiorFaturamento,
                    mediaFaturamento,
                    diasAcimaDaMedia
                };
            }

            const resultado = calcularFaturamento(faturamento);


            //Exerc. 4)---------------------------------------------------------------------------------------------


            const faturamentoPorEstado = {
                SP: 67836.43,
                RJ: 36678.66,
                MG: 29229.88,
                ES: 27165.48,
                Outros: 19849.53
            };

            function calcularFaturamentoTotal(faturamentoPorEstado) {
                return Object.values(faturamentoPorEstado).reduce((acc, valor) => acc + valor, 0);
            }

            function calcularPercentuais(faturamentoPorEstado) {
                const faturamentoTotal = calcularFaturamentoTotal(faturamentoPorEstado);

                const percentuais = {};
                for (const estado in faturamentoPorEstado) {
                    percentuais[estado] = ((faturamentoPorEstado[estado] / faturamentoTotal) * 100).toFixed(2);
                }

                return percentuais;
            }

            const percentuais = calcularPercentuais(faturamentoPorEstado);

            //Exerc. 5)---------------------------------------------------------------------------------------------


            function inverterString(str) {
                let strInvertida = '';

                for (let i = str.length - 1; i >= 0; i--) {
                    strInvertida += str[i]; 
                }

                return strInvertida;
            }
